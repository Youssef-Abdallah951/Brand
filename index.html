<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Apply the saved theme (or OS preference on first visit) before first
      // paint to avoid a flash of the wrong theme. Mirrors ThemeContext logic.
      try {
        var t = localStorage.getItem("jia-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#14110e" : "#FFFFFF");
        // Language mirror: html[dir/lang] set early to the saved preference so
        // RTL/LTR and fonts are correct from the very first paint.
        var lang = "ar";
        try { lang = localStorage.getItem("lumiere_lang") === "en" ? "en" : "ar"; } catch (e2) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
      } catch (e) {}
    </script>
    <title>JiA | Silk &amp; Essentials — حجابات رائعة، دفع عند الاستلام</title>
    <meta name="description" content="JiA Silk & Essentials — حجابات شيفون ومودال وساتان بجودة فاخرة، أكسسوارات هادئة وعلب هدايا أنيقة. توصيل سريع لجميع محافظات مصر والدفع عند الاستلام." />
    <meta property="og:title" content="JiA | Silk & Essentials — الحجاب… بأرقى نسخته" />
    <meta property="og:description" content="شيفون رائق ومودال حريري وساتان لامع — تفاصيل مدروسة وأناقة يومية، تصلك لكل مصر مع الدفع عند الاستلام." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hero.jpg" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="1013" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />
    <link rel="canonical" href="https://brand-alpha-sandy.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%231c1a17'/><text x='50' y='70' font-size='58' font-family='Georgia,serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'>J</text></svg>" />
    <style>
      /* Inline boot loader — painted instantly, replaced by React on mount. */
      #root:empty::after {
        content: "";
        display: block;
        min-height: 100dvh;
        background: #ffffff;
      }
      .boot-shell { position: fixed; inset: 0; display: grid; place-items: center; background: #ffffff; z-index: 1; }
      .dark .boot-shell { background: #14110e; }
      .boot-shell .logo {
        width: 56px; height: 56px; border-radius: 9999px; overflow: hidden;
        box-shadow: 0 10px 30px -12px rgba(28, 26, 23, .35);
      }
      .boot-shell img { width: 100%; height: 100%; object-fit: cover; }
      .boot-shell .bar { margin-top: 18px; width: 120px; height: 2px; border-radius: 2px; background: #f0e9df; overflow: hidden; }
      .boot-shell .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #9a7b4f; animation: bootSlide 1.1s ease-in-out infinite; }
      @keyframes bootSlide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
      @media (prefers-reduced-motion: reduce) { .boot-shell .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><span id="boot" style="display:none"></span></div>
    <!-- Branded boot screen: React removes it on the first commit. -->
    <script>
      (function () {
        try {
          var boot = document.createElement("div");
          boot.className = "boot-shell";
          boot.setAttribute("aria-hidden", "true");
          boot.innerHTML =
            '<div style="display:grid;place-items:center">' +
            '<div style="display:flex;flex-direction:column;align-items:center">' +
            '<div class="logo"><img src="/logo.png" alt="" /></div>' +
            '<div class="bar"><i></i></div>' +
            "</div></div>";
          document.body.appendChild(boot);
          var root = document.getElementById("root");
          var done = false;
          var obs = new MutationObserver(function () {
            if (root && root.childElementCount > 0 && !done) {
              done = true;
              obs.disconnect();
              boot.remove();
            }
          });
          if (root) obs.observe(root, { childList: true });
          window.setTimeout(function () { if (!done) { boot.remove(); obs.disconnect(); } }, 4000);
        } catch (e) {}
      })();
    </script>
    <noscript>
      <div style="padding:3rem;text-align:center;font-family:sans-serif">هذا المتجر يحتاج إلى تشغيل JavaScript. / This store requires JavaScript.</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
