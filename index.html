<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23e84393'/><text x='50' y='68' font-size='56' font-family='Georgia,serif' font-weight='bold' fill='white' text-anchor='middle'>J</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Apply the saved theme (or OS preference on first visit) before first
      // paint to avoid a flash of the wrong theme. Mirrors ThemeContext logic.
      try {
        var t = localStorage.getItem("jia-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#000000" : "#FFFFFF");
      } catch (e) {}
    </script>
    <title>JiA | Silk & Essentials</title>
    <meta name="description" content="JiA Silk & Essentials — مكياج، عناية بالبشرة والشعر، عطور أصلية مع توصيل سريع لجميع محافظات مصر والدفع عند الاستلام." />
    <meta property="og:title" content="JiA | Silk & Essentials" />
    <meta property="og:description" content="اكتشفي جمالك بطريقتك — منتجات أصلية تصلك حتى باب منزلك." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
